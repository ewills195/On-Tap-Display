<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadgerGander Homebrewery - On Tap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --ferment-accent: #38bdf8;
            --plan-accent: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 1rem 2rem;
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 0.75rem; 
            border-bottom: 2px solid #334155; 
            padding-bottom: 0.5rem; 
            width: 100%;
            flex-shrink: 0;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brewery-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
        }

        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; background: linear-gradient(45deg, #f59e0b, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .settings-btn { background: #334155; color: var(--text-main); border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
        .settings-btn:hover { background: #475569; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            width: 100%;
            flex-grow: 1;
            min-height: 0;
            margin-bottom: 0.5rem;
        }

        .column-section {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .section-title { 
            font-size: 1.25rem; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            color: var(--text-main);
            flex-shrink: 0;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            min-height: 0;
            flex-grow: 1;
        }
        
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 1.25rem; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); 
            border: 1px solid #334155; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            flex-shrink: 0;
        }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--accent); }
        .card.fermenting::before { background: var(--ferment-accent); }
        .card.planning::before { background: var(--plan-accent); }
        
        .beer-header { margin-bottom: 0.75rem; }
        .beer-name { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .beer-style { font-size: 0.95rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card.fermenting .beer-style { color: var(--ferment-accent); }
        .card.planning .beer-style { color: var(--plan-accent); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; background: #0f172a; padding: 0.75rem; border-radius: 8px; margin-bottom: 0.75rem; text-align: center; }
        .stats-grid.four-col { grid-template-columns: repeat(4, 1fr); }
        .stat-box .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .stat-box .value { font-size: 1.05rem; font-weight: 700; color: #fff; margin-top: 0.1rem; }

        .chart-container { position: relative; height: 130px; width: 100%; margin-bottom: 0.75rem; background: #0f172a; padding: 0.5rem; border-radius: 8px; }

        .beer-footer { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 0.5rem; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--card-bg); padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 450px; border: 1px solid #334155; }
        .modal-content h2 { margin-bottom: 1.5rem; font-size: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
        .save-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 1rem; }
        .save-btn:hover { background: #fbbf24; }

        .status-msg { text-align: center; color: var(--text-muted); font-size: 1rem; padding: 1.5rem; background: var(--card-bg); border-radius: 10px; border: 1px dashed #334155; }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="logo.svg" alt="BadgerGander Homebrewery Logo" class="brewery-logo">
            <h1>BadgerGander Homebrewery</h1>
        </div>
        <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </header>

    <div class="dashboard-grid">
        <div class="column-section">
            <div class="section-title">🍻 On Tap</div>
            <div id="tap-container" class="cards-container">
                <div class="status-msg">Loading taps...</div>
            </div>
        </div>

        <div class="column-section">
            <div class="section-title">🫧 Fermenting</div>
            <div id="fermenting-container" class="cards-container">
                <div class="status-msg">Loading batches...</div>
            </div>
        </div>

        <div class="column-section">
            <div class="section-title">📅 Up Next</div>
            <div id="planning-container" class="cards-container">
                <div class="status-msg">Loading brews...</div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>Brewfather API Settings</h2>
            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" placeholder="Enter your Brewfather User ID">
            </div>
            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" placeholder="Enter your Brewfather API Key">
            </div>
            <button class="save-btn" onclick="saveSettings()">Save & Connect</button>
        </div>
    </div>

    <script>
        let activeCharts = [];

        function openSettings() {
            document.getElementById('userId').value = localStorage.getItem('bf_user_id') || '';
            document.getElementById('apiKey').value = localStorage.getItem('bf_api_key') || '';
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function saveSettings() {
            const userId = document.getElementById('userId').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            if(userId && apiKey) {
                localStorage.setItem('bf_user_id', userId);
                localStorage.setItem('bf_api_key', apiKey);
                document.getElementById('settingsModal').style.display = 'none';
                fetchAllBatches();
            } else {
                alert('Please enter both User ID and API Key.');
            }
        }

        function getBatchName(batch) {
            return (batch.name && batch.name !== 'Batch') ? batch.name : (batch.recipe?.name || batch.name || 'Unknown Beer');
        }

        function cToF(celsius) {
            return (celsius * 9 / 5) + 32;
        }

        async function apiFetch(endpoint, userId, apiKey) {
            const response = await fetch(`https://api.brewfather.app/v2/${endpoint}`, {
                headers: {
                    'Authorization': 'Basic ' + btoa(userId + ':' + apiKey),
                    'Accept': 'application/json'
                }
            });
            if (!response.ok) throw new Error(`API Error: ${response.status} ${response.statusText}`);
            return response.json();
        }

        async function fetchAllBatches() {
            const userId = localStorage.getItem('bf_user_id');
            const apiKey = localStorage.getItem('bf_api_key');

            if (!userId || !apiKey) {
                openSettings();
                return;
            }

            activeCharts.forEach(chart => chart.destroy());
            activeCharts = [];

            try {
                const [completed, fermenting, planning] = await Promise.all([
                    apiFetch('batches?status=Completed&complete=true', userId, apiKey),
                    apiFetch('batches?status=Fermenting&complete=true', userId, apiKey),
                    apiFetch('batches?status=Planning&complete=true', userId, apiKey)
                ]);

                renderCompleted(completed);
                await renderFermenting(fermenting, userId, apiKey);
                renderPlanning(planning);

            } catch (error) {
                console.error(error);
                document.getElementById('tap-container').innerHTML = `<div class="status-msg" style="color: #ef4444;">❌ Error: ${error.message}</div>`;
            }
        }

        function renderCompleted(batches) {
            const container = document.getElementById('tap-container');
            if (batches.length === 0) {
                container.innerHTML = `<div class="status-msg">No beers on tap.</div>`;
                return;
            }

            container.innerHTML = '';
            batches.forEach(batch => {
                const name = getBatchName(batch);
                const style = batch.recipe?.style?.name || batch.style || 'Custom Style';
                const abv = batch.abv ? batch.abv.toFixed(1) + '%' : (batch.recipe?.abv ? batch.recipe.abv.toFixed(1) + '%' : 'N/A');
                const ibu = batch.ibu || batch.recipe?.ibu || 'N/A';
                const srm = batch.color || batch.recipe?.color || 'N/A';
                const batchNo = batch.batchNo ? `#${batch.batchNo}` : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="beer-header">
                        <div class="beer-name">${name}</div>
                        <div class="beer-style">${style}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-box"><div class="label">ABV</div><div class="value">${abv}</div></div>
                        <div class="stat-box"><div class="label">IBU</div><div class="value">${ibu}</div></div>
                        <div class="stat-box"><div class="label">SRM</div><div class="value">${srm}</div></div>
                    </div>
                    <div class="beer-footer">
                        <span>Batch ${batchNo}</span>
                        <span>On Tap</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function renderFermenting(batches, userId, apiKey) {
            const container = document.getElementById('fermenting-container');
            if (batches.length === 0) {
                container.innerHTML = `<div class="status-msg">No active fermentation.</div>`;
                return;
            }

            container.innerHTML = '';
            for (const batch of batches) {
                const name = getBatchName(batch);
                const style = batch.recipe?.style?.name || batch.style || 'Custom Style';
                const og = batch.measuredOg || batch.recipe?.og || 'N/A';
                const estFg = batch.recipe?.fg || 'N/A';
                const batchNo = batch.batchNo ? `#${batch.batchNo}` : '';
                const canvasId = `chart-${batch._id}`;

                let readings = [];
                try {
                    readings = await apiFetch(`batches/${batch._id}/readings`, userId, apiKey);
                    readings.sort((a, b) => a.time - b.time);
                } catch (e) {
                    console.warn(`Could not load readings for ${name}`, e);
                }

                const latestReading = readings.length > 0 ? readings[readings.length - 1] : null;
                const latestSg = latestReading && latestReading.sg != null ? latestReading.sg.toFixed(3) : (batch.measuredFg || 'N/A');
                const latestTemp = latestReading && latestReading.temp != null ? cToF(latestReading.temp).toFixed(1) + '°F' : 'N/A';

                const card = document.createElement('div');
                card.className = 'card fermenting';
                card.innerHTML = `
                    <div class="beer-header">
                        <div class="beer-name">${name}</div>
                        <div class="beer-style">${style}</div>
                    </div>
                    <div class="stats-grid four-col">
                        <div class="stat-box"><div class="label">OG</div><div class="value">${typeof og === 'number' ? og.toFixed(3) : og}</div></div>
                        <div class="stat-box"><div class="label">SG</div><div class="value">${latestSg}</div></div>
                        <div class="stat-box"><div class="label">FG</div><div class="value">${typeof estFg === 'number' ? estFg.toFixed(3) : estFg}</div></div>
                        <div class="stat-box"><div class="label">Temp</div><div class="value" style="color: #fb923c;">${latestTemp}</div></div>
                    </div>
                    <div class="chart-container">
                        <canvas id="${canvasId}"></canvas>
                    </div>
                    <div class="beer-footer">
                        <span>Batch ${batchNo}</span>
                        <span>Fermenting</span>
                    </div>
                `;
                container.appendChild(card);

                if (readings.length > 0) {
                    const ctx = document.getElementById(canvasId).getContext('2d');
                    const labels = readings.map(r => new Date(r.time).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
                    const sgPoints = readings.map(r => r.sg ?? null);
                    const tempPoints = readings.map(r => r.temp != null ? Number(cToF(r.temp).toFixed(1)) : null);

                    const chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: 'SG',
                                    data: sgPoints,
                                    borderColor: '#38bdf8',
                                    backgroundColor: 'rgba(56, 189, 248, 0.15)',
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    fill: true,
                                    tension: 0.3,
                                    yAxisID: 'y'
                                },
                                {
                                    label: 'Temp',
                                    data: tempPoints,
                                    borderColor: '#fb923c',
                                    borderWidth: 1.5,
                                    borderDash: [3, 3],
                                    pointRadius: 0,
                                    fill: false,
                                    tension: 0.3,
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            plugins: {
                                legend: {
                                    display: true,
                                    labels: { color: '#94a3b8', boxWidth: 8, font: { size: 10 } }
                                }
                            },
                            scales: {
                                x: { ticks: { color: '#94a3b8', maxTicksLimit: 4, font: { size: 9 } }, grid: { display: false } },
                                y: {
                                    type: 'linear',
                                    position: 'left',
                                    ticks: { color: '#38bdf8', font: { size: 9 } },
                                    grid: { color: '#334155' }
                                },
                                y1: {
                                    type: 'linear',
                                    position: 'right',
                                    ticks: { color: '#fb923c', font: { size: 9 }, callback: v => v + '°' },
                                    grid: { drawOnChartArea: false }
                                }
                            }
                        }
                    });
                    activeCharts.push(chart);
                }
            }
        }

        function renderPlanning(batches) {
            const container = document.getElementById('planning-container');
            const now = Date.now();
            
            const upcoming = batches
                .filter(b => b.brewDate && b.brewDate > now)
                .sort((a, b) => a.brewDate - b.brewDate);

            if (upcoming.length === 0) {
                container.innerHTML = `<div class="status-msg">No upcoming brews.</div>`;
                return;
            }

            container.innerHTML = "";
            upcoming.forEach(batch => {
                const name = getBatchName(batch);
                const style = batch.recipe?.style?.name || batch.style || 'Custom Style';
                const estAbv = batch.recipe?.abv ? batch.recipe.abv.toFixed(1) + '%' : 'N/A';
                const estIbu = batch.recipe?.ibu || 'N/A';
                const brewDateStr = new Date(batch.brewDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                const batchNo = batch.batchNo ? `#${batch.batchNo}` : '';

                const card = document.createElement('div');
                card.className = 'card planning';
                card.innerHTML = `
                    <div class="beer-header">
                        <div class="beer-name">${name}</div>
                        <div class="beer-style">${style}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-box"><div class="label">Brew Date</div><div class="value" style="font-size: 0.95rem;">${brewDateStr}</div></div>
                        <div class="stat-box"><div class="label">Est. ABV</div><div class="value">${estAbv}</div></div>
                        <div class="stat-box"><div class="label">Est. IBU</div><div class="value">${estIbu}</div></div>
                    </div>
                    <div class="beer-footer">
                        <span>Batch ${batchNo}</span>
                        <span>Planned</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => {
            if (localStorage.getItem('bf_user_id')) {
                fetchAllBatches();
                setInterval(fetchAllBatches, 300000);
            } else {
                openSettings();
            }
        };
    </script>
</body>
</html>
