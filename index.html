<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badgergander Homebrewery</title>
    <!-- Modern, geometric font matching the bold logo styling -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,500;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-base: #090d16;
            --card-bg: rgba(18, 24, 38, 0.42);
            --stats-bg: rgba(10, 14, 22, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            /* Modern Red & Blue / Taproom Accents */
            --accent-tap: #f43f5e;     /* Modern Crimson Red */
            --accent-left: #fb7185;    /* Soft Red / Rose */
            --ferment-blue: #38bdf8;   /* Electric Craft Blue */
            --plan-purple: #c084fc;    /* Deep Craft Violet */
            --live-green: #34d399;     /* Modern Mint Live Dot */
            --border-glow: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Lock full viewport - no page scrolling */
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-main);
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 1rem 1.5rem;
            background-image: linear-gradient(rgba(9, 13, 22, 0.55), rgba(9, 13, 22, 0.65)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 0.85rem; 
            border-bottom: 1px solid var(--border-glow); 
            width: 100%;
            flex-shrink: 0;
            background: rgba(13, 17, 26, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.65rem 1rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .brewery-logo {
            height: 46px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        h1 { 
            font-size: 1.65rem; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .settings-btn { 
            background: rgba(30, 41, 59, 0.6); 
            color: var(--text-main); 
            border: 1px solid var(--border-glow); 
            padding: 0.45rem 0.9rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem; 
            transition: all 0.2s ease; 
            backdrop-filter: blur(4px);
        }
        .settings-btn:hover { background: rgba(51, 65, 85, 0.8); border-color: rgba(255,255,255,0.3); }

        /* Vertical stacking for portrait displays */
        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            flex-grow: 1;
            min-height: 0; 
            margin-bottom: 0.2rem;
        }

        .column-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
        }

        /* Give Fermenting extra vertical space for the chart */
        #fermenting-section {
            flex: 1.65;
        }

        .section-title { 
            font-size: 1.1rem; 
            font-weight: 700; 
            margin-bottom: 0.45rem; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            color: var(--text-main);
            flex-shrink: 0;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            letter-spacing: 0.3px;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            overflow-y: auto;
            min-height: 0;
            flex-grow: 1;
        }

        /* Side-by-side layout for On Tap section */
        #tap-container {
            flex-direction: row;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 0.85rem;
        }

        #tap-container .card {
            flex: 1;
            min-width: 0;
        }
        
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px; 
            padding: 1.1rem; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45); 
            border: 1px solid var(--border-glow); 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            flex-grow: 1;
            min-height: 0;
            transition: opacity 0.3s ease;
        }
        
        /* Modern accent bars matching theme hues */
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--accent-tap); }
        .card.fermenting::before { background: var(--ferment-blue); }
        .card.planning::before { background: var(--plan-purple); }
        
        /* Grayed out style for On Deck beers */
        .card.on-deck {
            background: rgba(10, 14, 22, 0.25);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .card.on-deck .beer-header,
        .card.on-deck .stats-grid,
        .card.on-deck .beer-footer {
            opacity: 0.85;
        }
        .card.on-deck::before {
            background: #475569;
        }

        .beer-header { margin-bottom: 0.6rem; flex-shrink: 0; }
        .beer-header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
        
        .beer-name { 
            font-size: 1.3rem; 
            font-weight: 800; 
            color: #ffffff; 
            margin-bottom: 0.1rem; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: -0.3px;
        }
        
        .beer-style { 
            font-size: 0.85rem; 
            color: var(--accent-left); 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.75px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.6); 
        }
        .card.fermenting .beer-style { color: var(--ferment-blue); }
        .card.planning .beer-style { color: var(--plan-purple); }
        .card.on-deck .beer-style { color: #94a3b8; }

        .batch-no {
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 0.35rem;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .tap-badge {
            background: rgba(30, 41, 59, 0.6);
            color: var(--text-muted);
            border: 1px solid var(--border-glow);
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .tap-badge:hover { background: rgba(51, 65, 85, 0.85); color: #fff; }
        .tap-badge.assigned {
            background: var(--accent-tap);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.4);
        }
        .card.on-deck .tap-badge.assigned {
            background: #475569;
            color: #cbd5e1;
            border-color: #64748b;
            box-shadow: none;
        }

        /* Modern Live Data Indicator Pulse */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(52, 211, 153, 0.12);
            color: var(--live-green);
            border: 1px solid rgba(52, 211, 153, 0.35);
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--live-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--live-green);
            animation: pulse-live 1.8s infinite ease-in-out;
        }

        @keyframes pulse-live {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 0.5rem; 
            background: var(--stats-bg); 
            padding: 0.65rem; 
            border-radius: 8px; 
            margin-bottom: 0.65rem; 
            text-align: center; 
            flex-shrink: 0; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            backdrop-filter: blur(4px); 
        }
        .stats-grid.four-col { grid-template-columns: repeat(4, 1fr); }
        
        .stat-box .label { 
            font-size: 0.6rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.5px;
        }
        
        .stat-box .value { 
            font-size: 1.05rem; 
            font-weight: 700; 
            color: #fff; 
            margin-top: 0.1rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 0.4rem; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Larger Beer Glass Graphic */
        .beer-glass-icon {
            width: 26px;
            height: 35px;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .chart-container { 
            position: relative; 
            flex-grow: 1; 
            width: 100%; 
            min-height: 130px;
            margin-bottom: 0.65rem; 
            background: var(--stats-bg); 
            padding: 0.5rem; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        .beer-footer { 
            font-size: 0.78rem; 
            color: var(--text-muted); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
            padding-top: 0.5rem; 
            flex-shrink: 0; 
            font-family: 'JetBrains Mono', monospace;
        }

        /* Modal styling matching theme */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 15, 0.85); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px); }
        .modal-content { background: rgba(18, 24, 38, 0.92); backdrop-filter: blur(16px); padding: 2.2rem; border-radius: 16px; width: 100%; max-width: 420px; border: 1px solid var(--border-glow); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .modal-content h2 { margin-bottom: 1.2rem; font-size: 1.35rem; font-weight: 700; color: #fff; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(10, 14, 22, 0.7); color: #fff; font-size: 0.95rem; font-family: 'JetBrains Mono', monospace; }
        .form-group input:focus { outline: none; border-color: var(--accent-tap); }
        .save-btn { width: 100%; background: var(--accent-tap); color: #fff; border: none; padding: 0.7rem; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 0.8rem; transition: background 0.2s; font-size: 0.95rem; }
        .save-btn:hover { background: #e11d48; }

        .status-msg { text-align: center; color: var(--text-muted); font-size: 0.95rem; padding: 1.2rem; background: var(--card-bg); border-radius: 10px; border: 1px dashed rgba(255,255,255,0.15); width: 100%; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="logo.svg" alt="Badgergander Homebrewery Logo" class="brewery-logo">
            <h1>Badgergander Homebrewery</h1>
        </div>
        <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </header>

    <div class="dashboard-grid">
        <div id="tap-section" class="column-section">
            <div class="section-title">On Tap</div>
            <div id="tap-container" class="cards-container">
                <div class="status-msg">Loading taps...</div>
            </div>
        </div>

        <div id="fermenting-section" class="column-section" style="display: none;">
            <div class="section-title">Fermenting</div>
            <div id="fermenting-container" class="cards-container"></div>
        </div>

        <div id="planning-section" class="column-section" style="display: none;">
            <div class="section-title">Up Next</div>
            <div id="planning-container" class="cards-container"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>Brewfather API Settings</h2>
            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" placeholder="Enter your Brewfather User ID">
            </div>
            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" placeholder="Enter your Brewfather API Key">
            </div>
            <button class="save-btn" onclick="saveSettings()">Save & Connect</button>
        </div>
    </div>

    <script>
        let activeCharts = [];
        let cachedCompleted = [];

        function openSettings() {
            document.getElementById('userId').value = localStorage.getItem('bf_user_id') || '';
            document.getElementById('apiKey').value = localStorage.getItem('bf_api_key') || '';
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function saveSettings() {
            const userId = document.getElementById('userId').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            if(userId && apiKey) {
                localStorage.setItem('bf_user_id', userId);
                localStorage.setItem('bf_api_key', apiKey);
                document.getElementById('settingsModal').style.display = 'none';
                fetchAllBatches();
            } else {
                alert('Please enter both User ID and API Key.');
            }
        }

        function srmToHex(srm) {
            if (srm == null || isNaN(srm)) return '#f59e0b';
            
            const srmTable = [
                { srm: 1, hex: '#F8F753' }, { srm: 2, hex: '#F6F513' }, { srm: 3, hex: '#ECE81A' },
                { srm: 4, hex: '#DFD21D' }, { srm: 5, hex: '#D8BC23' }, { srm: 6, hex: '#D1A825' },
                { srm: 7, hex: '#CA9627' }, { srm: 8, hex: '#C18527' }, { srm: 9, hex: '#B87628' },
                { srm: 10, hex: '#B06929' }, { srm: 11, hex: '#A65D2A' }, { srm: 12, hex: '#9F532B' },
                { srm: 13, hex: '#94492B' }, { srm: 14, hex: '#8D402B' }, { srm: 15, hex: '#85372B' },
                { srm: 16, hex: '#7C2F2B' }, { srm: 17, hex: '#772A2A' }, { srm: 18, hex: '#6F2229' },
                { srm: 19, hex: '#681C29' }, { srm: 20, hex: '#631829' }, { srm: 22, hex: '#5B1328' },
                { srm: 24, hex: '#530F26' }, { srm: 26, hex: '#4D0C25' }, { srm: 28, hex: '#480A24' },
                { srm: 30, hex: '#430822' }, { srm: 35, hex: '#3A061F' }, { srm: 40, hex: '#31041B' }
            ];

            if (srm <= 1) return srmTable[0].hex;
            if (srm >= 40) return srmTable[srmTable.length - 1].hex;

            for (let i = 0; i < srmTable.length - 1; i++) {
                if (srm >= srmTable[i].srm && srm <= srmTable[i+1].srm) {
                    return srmTable[i].hex;
                }
            }
            return '#31041B';
        }

        function createBeerGlassSVG(srm) {
            const hexColor = srmToHex(srm);
            return `
            <svg class="beer-glass-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 2H18L16 20C15.9 21.1 15 22 13.9 22H10.1C9 22 8.1 21.1 8 20L6 2Z" fill="#090d16" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M6.5 6H17.5L15.8 19.4C15.75 20.3 15 21 14.1 21H9.9C9 21 8.25 20.3 8.2 19.4L6.5 6Z" fill="${hexColor}"/>
                <path d="M6.3 4H17.7C18.2 4 18.5 4.5 18.3 5C18 5.6 17.3 6 16.5 6H7.5C6.7 6 6 5.6 5.7 5C5.5 4.5 5.8 4 6.3 4Z" fill="#f8fafc" opacity="0.85"/>
            </svg>`;
        }

        function getTapAssignments() {
            try {
                return JSON.parse(localStorage.getItem('bf_tap_assignments') || '{}');
            } catch {
                return {};
            }
        }

        function saveTapAssignments(map) {
            localStorage.setItem('bf_tap_assignments', JSON.stringify(map));
        }

        function cycleTapAssignment(batchId) {
            const map = getTapAssignments();
            const current = map[batchId] || 'Unassigned';
            
            if (current === 'Unassigned') {
                map[batchId] = 'Left Tap';
            } else if (current === 'Left Tap') {
                map[batchId] = 'Right Tap';
            } else if (current === 'Right Tap') {
                map[batchId] = 'On Deck';
            } else {
                delete map[batchId];
            }

            saveTapAssignments(map);
            renderCompleted(cachedCompleted);
        }

        function getBatchName(batch) {
            return (batch.name && batch.name !== 'Batch') ? batch.name : (batch.recipe?.name || batch.name || 'Unknown Beer');
        }

        function cToF(celsius) {
            return (celsius * 9 / 5) + 32;
        }

        async function apiFetch(endpoint, userId, apiKey) {
            const response = await fetch(`https://api.brewfather.app/v2/${endpoint}`, {
                headers: {
                    'Authorization': 'Basic ' + btoa(userId + ':' + apiKey),
                    'Accept': 'application/json'
                }
            });
            if (!response.ok) throw new Error(`API Error: ${response.status} ${response.statusText}`);
            return response.json();
        }

        async function fetchAllBatches() {
            const userId = localStorage.getItem('bf_user_id');
            const apiKey = localStorage.getItem('bf_api_key');

            if (!userId || !apiKey) {
                openSettings();
                return;
            }

            activeCharts.forEach(chart => chart.destroy());
            activeCharts = [];

            try {
                const [completed, fermenting, planning] = await Promise.all([
                    apiFetch('batches?status=Completed&complete=true', userId, apiKey),
                    apiFetch('batches?status=Fermenting&complete=true', userId, apiKey),
                    apiFetch('batches?status=Planning&complete=true', userId, apiKey)
                ]);

                cachedCompleted = completed;
                renderCompleted(completed);
                await renderFermenting(fermenting, userId, apiKey);
                renderPlanning(planning);

            } catch (error) {
                console.error(error);
                document.getElementById('tap-container').innerHTML = `<div class="status-msg" style="color: #ef4444;">❌ Error: ${error.message}</div>`;
            }
        }

        function renderCompleted(batches) {
            const container = document.getElementById('tap-container');
            if (batches.length === 0) {
                container.innerHTML = `<div class="status-msg">No beers on tap.</div>`;
                return;
            }

            const activeIds = new Set(batches.map(b => b._id));
            const assignments = getTapAssignments();
            let cleaned = false;
            for (const id of Object.keys(assignments)) {
                if (!activeIds.has(id)) {
                    delete assignments[id];
                    cleaned = true;
                }
            }
            if (cleaned) saveTapAssignments(assignments);

            const order = { 'Left Tap': 1, 'Right Tap': 2, 'On Deck': 3 };
            const sorted = [...batches].sort((a, b) => {
                const rankA = order[assignments[a._id]] || 4;
                const rankB = order[assignments[b._id]] || 4;
                return rankA - rankB;
            });

            container.innerHTML = '';
            sorted.forEach(batch => {
                const name = getBatchName(batch);
                const style = batch.recipe?.style?.name || batch.style || 'Custom Style';
                const abv = batch.abv ? batch.abv.toFixed(1) + '%' : (batch.recipe?.abv ? batch.recipe.abv.toFixed(1) + '%' : 'N/A');
                const ibu = batch.ibu || batch.recipe?.ibu || 'N/A';
                const srmVal = batch.color || batch.recipe?.color;
                const srmDisplay = srmVal != null ? Number(srmVal).toFixed(1) : 'N/A';
                const beerGlassHTML = createBeerGlassSVG(srmVal);
                const batchNo = batch.batchNo ? `#${batch.batchNo}` : '';
                const batchSpan = batchNo ? `<span class="batch-no">• Batch ${batchNo}</span>` : '';

                const assignedTap = assignments[batch._id];
                const badgeText = assignedTap || 'Assign Tap';
                const badgeClass = assignedTap ? 'tap-badge assigned' : 'tap-badge';
                
                const cardClass = assignedTap === 'On Deck' ? 'card on-deck' : 'card';

                const card = document.createElement('div');
                card.className = cardClass;
                card.innerHTML = `
                    <div class="beer-header">
                        <div class="beer-header-top">
                            <div class="beer-name">${name}</div>
                            <button class="${badgeClass}" onclick="cycleTapAssignment('${batch._id}')">${badgeText}</button>
                        </div>
                        <div class="beer-style">${style}${batchSpan}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-box"><div class="label">ABV</div><div class="value">${abv}</div></div>
                        <div class="stat-box"><div class="label">IBU</div><div class="value">${ibu}</div></div>
                        <div class="stat-box"><div class="label">SRM</div><div class="value">${beerGlassHTML} ${srmDisplay}</div></div>
                    </div>
                    <div class="beer-footer">
                        <span>Batch ${batchNo}</span>
                        <span>On Tap</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function renderFermenting(batches, userId, apiKey) {
            const section = document.getElementById('fermenting-section');
            const container = document.getElementById('fermenting-container');
            
            if (batches.length === 0) {
                section.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            section.style.display = 'flex';
            container.innerHTML = '';

            for (const batch of batches) {
                const name = getBatchName(batch);
                const style = batch.recipe?.style?.name || batch.style || 'Custom Style';
                const og = batch.measuredOg || batch.recipe?.og;
                const estFg = batch.recipe?.fg;
                const batchNo = batch.batchNo ? `#${batch.batchNo}` : '';
                const batchSpan = batchNo ? `<span class="batch-no">• Batch ${batchNo}</span>` : '';
                const canvasId = `chart-${batch._id}`;

                let readings = [];
                try {
                    readings = await apiFetch(`batches/${batch._id}/readings`, userId, apiKey);
                    readings.sort((a, b) => a.time - b.time);
                } catch (e) {
                    console.warn(`Could not load readings for ${name}`, e);
                }

                const latestReading = readings.length > 0 ? readings[readings.length - 1] : null;
                const latestSg = latestReading && latestReading.sg != null ? latestReading.sg : batch.measuredFg;
                const latestTemp = latestReading && latestReading.temp != null ? cToF(latestReading.temp).toFixed(1) + '°F' : 'N/A';

                const isLive = latestReading && latestReading.time && (Date.now() - latestReading.time <= 3600000);
                const liveBadgeHTML = isLive ? `<div class="live-badge"><span class="live-dot"></span>Live</div>` : '';

                let attenuationDisplay = 'N/A';
                if (og != null && latestSg != null && estFg != null && og > estFg) {
                    const attenuation = ((og - latestSg) / (og - estFg)) * 100;
                    attenuationDisplay = Math.min(Math.max(attenuation, 0), 100).toFixed(0) + '%';
                }

                const ogDisplay = og != null ? og.toFixed(3) : 'N/A';
                const sgDisplay = latestSg != null ? Number(latestSg).toFixed(3) : 'N/A';

                const card = document.createElement('div');
                card.className = 'card fermenting';
                card.innerHTML = `
                    <div class="beer-header">
                        <div class="beer-header-top">
                            <div class="beer-name">${name}</div>
                            ${liveBadgeHTML}
                        </div>
                        <div class="beer-style">${style}${batchSpan}</div>
                    </div>
                    <div class="stats-grid four-col">
                        <div class="stat-box"><div class="label">SG</div><div class="value">${sgDisplay}</div></div>
                        <div class="stat-box"><div class="label">Temp</div><div class="value" style="color: #fb923c;">${latestTemp}</div></div>
                        <div class="stat-box"><div class="label">App. Att.</div><div class="value" style="color: #38bdf8;">${attenuationDisplay}</div></div>
                        <div class="stat-box"><div class="label">OG</div><div class="value">${ogDisplay}</div></div>
                    </div>
                    <div class="chart-container">
                        <canvas id="${canvasId}"></canvas>
                    </div>
                    <div class="beer-footer">
                        <span>Batch ${batchNo}</span>
                        <span>Fermenting</span>
                    </div>
                `;
                container.appendChild(card);

                if (readings.length > 0) {
                    const ctx = document.getElementById(canvasId).getContext('2d');
                    const labels = readings.map(r => new Date(r.time).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
                    const sgPoints = readings.map(r => r.sg ?? null);
                    const tempPoints = readings.map(r => r.temp != null ? Number(cToF(r.temp).toFixed(1)) : null);

                    const chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: 'SG',
                                    data: sgPoints,
                                    borderColor: '#38bdf8',
                                    backgroundColor: 'rgba(56, 189, 248, 0.15)',
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    fill: true,
                                    tension: 0.3,
                                    yAxisID: 'y'
                                },
                                {
                                    label: 'Temp',
                                    data: tempPoints,
                                    borderColor: '#fb923c',
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    fill: false,
                                    tension: 0.3,
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            plugins: {
                                legend: {
                                    display: true,
                                    labels: { color: '#cbd5e1', boxWidth: 8, font: { size: 10, family: 'Plus Jakarta Sans' } }
                                }
                            },
                            scales: {
                                x: { ticks: { color: '#94a3b8', maxTicksLimit: 6, font: { size: 10, family: 'JetBrains Mono' } }, grid: { display: false } },
                                y: {
                                    type: 'linear',
                                    position: 'left',
                                    ticks: { color: '#38bdf8', font: { size: 10, family: 'JetBrains Mono' } },
                                    grid: { color: 'rgba(255, 255, 255, 0.06)' }
                                },
                                y1: {
                                    type: 'linear',
                                    position: 'right',
                                    ticks: { color: '#fb923c', font: { size: 10, family: 'JetBrains Mono' }, callback: v => v + '°' },
                                    grid: { drawOnChartArea: false }
                                }
                            }
                        }
                    });
                    activeCharts.push(chart);
                }
            }
        }

        function renderPlanning(batches) {
            const section = document.getElementById('planning-section');
            const container = document.getElementById('planning-container');
            const now = Date.now();
            
            const upcoming = batches
                .filter(b => b.brewDate && b.brewDate > now)
                .sort((a, b) => a.brewDate - b.brewDate);

            if (upcoming.length === 0) {
                section.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            section.style.display = 'flex';
            container.innerHTML = '';

            upcoming.forEach(batch => {
                const name = getBatchName(batch);
                const style = batch.recipe?.style?.name || batch.style || 'Custom Style';
                const estAbv = batch.recipe?.abv ? batch.recipe.abv.toFixed(1) + '%' : 'N/A';
                const estIbu = batch.recipe?.ibu || 'N/A';
                const brewDateStr = new Date(batch.brewDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                const batchNo = batch.batchNo ? `#${batch.batchNo}` : '';
                const batchSpan = batchNo ? `<span class="batch-no">• Batch ${batchNo}</span>` : '';

                const card = document.createElement('div');
                card.className = 'card planning';
                card.innerHTML = `
                    <div class="beer-header">
                        <div class="beer-name">${name}</div>
                        <div class="beer-style">${style}${batchSpan}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-box"><div class="label">Brew Date</div><div class="value" style="font-size: 0.9rem;">${brewDateStr}</div></div>
                        <div class="stat-box"><div class="label">Est. ABV</div><div class="value">${estAbv}</div></div>
                        <div class="stat-box"><div class="label">Est. IBU</div><div class="value">${estIbu}</div></div>
                    </div>
                    <div class="beer-footer">
                        <span>Batch ${batchNo}</span>
                        <span>Planned</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => {
            if (localStorage.getItem('bf_user_id')) {
                fetchAllBatches();
                setInterval(fetchAllBatches, 900000); // 15 minutes
            } else {
                openSettings();
            }
        };
    </script>
</body>
</html>
